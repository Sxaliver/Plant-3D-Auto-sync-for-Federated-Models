<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
  <title id="title">Plant 3D Auto sync: from cloud Xrefs to system and Total federated models</title>
  <desc id="desc">Published DWGs in each cloud system folder are pulled to local Xref folders. Each local system assembly DWG references its local sources and exports its own separate NWC. The system NWC files are uploaded and then federated into the cloud or non-local Total model. Total is not a local DWG assembly and its inputs are NWC files, not system DWG files. Upload is currently manual.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#3268bf"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#19324c;font-size:19px}
      .title{font-size:30px;font-weight:700}.section{font-size:21px;font-weight:700}.node{fill:white;stroke:#c4d2e4;stroke-width:1.4}.main{fill:#e5efff;stroke:#3268bf;stroke-width:1.8}.small{font-size:16px;fill:#4b627c}.bold{font-weight:600}.edge{fill:none;stroke:#3268bf;stroke-width:2.3;marker-end:url(#arrow)}.bus{fill:none;stroke:#3268bf;stroke-width:2.3}
    </style>
  </defs>
  <rect width="1440" height="1160" rx="20" fill="#f4f7fb"/>
  <text x="48" y="47" class="title">Auto sync · Plant 3D federated-model file flow</text>
  <text x="48" y="78" class="small">Cloud DWG → local system DWG → one NWC per system → upload → cloud / non-local Total federation</text>
  <rect x="40" y="103" width="1360" height="155" rx="14" fill="#eaf1fc"/>
  <text x="60" y="137" class="section">1  ACC / Forma · published source DWG by system and floor</text>
  <rect class="node" x="80" y="159" width="320" height="74" rx="10"/>
  <text x="100" y="187" class="bold">9421 system folder</text><text x="100" y="214" class="small">Floor / equipment / piping DWG</text>
  <rect class="node" x="560" y="159" width="320" height="74" rx="10"/>
  <text x="580" y="187" class="bold">9424 · Gypsum dewatering</text><text x="580" y="214" class="small">EL+5.30 / EL+16.40 / GDS_PIPING</text>
  <rect class="node" x="1040" y="159" width="320" height="74" rx="10"/>
  <text x="1060" y="187" class="bold">Other configured systems</text><text x="1060" y="214" class="small">9422, 9423, 9425–9429, 9431</text>
  <path class="edge" d="M240 234V297"/><path class="edge" d="M720 234V297"/><path class="edge" d="M1200 234V297"/>
  <text x="252" y="283" class="bold">Pull</text><text x="732" y="283" class="bold">Pull</text><text x="1212" y="283" class="bold">Pull</text>
  <rect x="40" y="305" width="1360" height="323" rx="14" fill="#edf5f2"/>
  <text x="60" y="332" class="section">2  Local workspace · download sources, then federate each system</text>
  <rect class="node" x="80" y="350" width="320" height="74" rx="10"/><text x="100" y="379" class="bold">local_9421 / *.dwg</text><text x="100" y="405" class="small">Local source Xrefs</text>
  <rect class="node" x="560" y="350" width="320" height="74" rx="10"/><text x="580" y="379" class="bold">local_9424 / *.dwg</text><text x="580" y="405" class="small">Local source Xrefs</text>
  <rect class="node" x="1040" y="350" width="320" height="74" rx="10"/><text x="1060" y="379" class="bold">local_[system] / *.dwg</text><text x="1060" y="405" class="small">Local source Xrefs</text>
  <path class="edge" d="M240 424V500"/><path class="edge" d="M720 424V500"/><path class="edge" d="M1200 424V500"/>
  <text x="255" y="468" class="small">Xref / federate</text><text x="735" y="468" class="small">Xref / federate</text><text x="1215" y="468" class="small">Xref / federate</text>
  <rect class="main" x="80" y="505" width="320" height="88" rx="10"/><text x="100" y="538" class="bold">9421 system assembly DWG</text><text x="100" y="568" class="small">References local 9421 sources</text>
  <rect class="main" x="560" y="505" width="320" height="88" rx="10"/><text x="580" y="538" class="bold">9424 system assembly DWG</text><text x="580" y="568" class="small">References local 9424 sources</text>
  <rect class="main" x="1040" y="505" width="320" height="88" rx="10"/><text x="1060" y="538" class="bold">Other system assembly DWG</text><text x="1060" y="568" class="small">References its local sources</text>
  <path class="edge" d="M240 594V690"/><path class="edge" d="M720 594V690"/><path class="edge" d="M1200 594V690"/>
  <text x="255" y="659" class="small">Native export</text><text x="735" y="659" class="small">Native export</text><text x="1215" y="659" class="small">Native export</text>
  <rect class="node" x="80" y="700" width="320" height="80" rx="10"/><text x="100" y="731" class="bold">9421.nwc</text><text x="100" y="760" class="small">One NWC for system 9421</text>
  <rect class="node" x="560" y="700" width="320" height="80" rx="10"/><text x="580" y="731" class="bold">9424.nwc</text><text x="580" y="760" class="small">One NWC for system 9424</text>
  <rect class="node" x="1040" y="700" width="320" height="80" rx="10"/><text x="1060" y="731" class="bold">[system].nwc</text><text x="1060" y="760" class="small">One separate NWC per other system</text>
  <path class="edge" d="M240 780V822"/><path class="edge" d="M720 780V822"/><path class="edge" d="M1200 780V822"/>
  <text x="255" y="807" class="small">Upload</text><text x="735" y="807" class="small">Upload</text><text x="1215" y="807" class="small">Upload</text>
  <rect x="80" y="830" width="320" height="75" rx="10" fill="#eaf1fc"/><text x="100" y="860" class="bold">ACC / Forma · 9421 NWC</text><text x="100" y="886" class="small">Cloud delivery file</text>
  <rect x="560" y="830" width="320" height="75" rx="10" fill="#eaf1fc"/><text x="580" y="860" class="bold">ACC / Forma · 9424 NWC</text><text x="580" y="886" class="small">Cloud delivery file</text>
  <rect x="1040" y="830" width="320" height="75" rx="10" fill="#eaf1fc"/><text x="1060" y="860" class="bold">ACC / Forma · system NWC</text><text x="1060" y="886" class="small">Separate file for each system</text>
  <path class="bus" d="M240 905V945H1200V905M720 905V945"/>
  <text x="276" y="933" class="small">Uploaded system NWC files</text>
  <path class="edge" d="M720 945V982"/>
  <rect class="main" x="440" y="990" width="560" height="95" rx="12"/><text x="462" y="1023" class="section">Total federated model · cloud / non-local</text><text x="462" y="1052" class="small">Assembled from the uploaded NWC of each system</text><text x="462" y="1074" class="small">NWC inputs · not a local system-DWG assembly</text>
  <text x="48" y="1121" class="small">Local federation uses DWG Xrefs. Total federation uses the uploaded per-system NWC files, outside the local Plant workspace.</text>
  <text x="48" y="1145" class="small">Local NWC output: YYYY-MM-DD folder. Upload is currently manual; automatic NWC Push is not implemented.</text>
</svg>
